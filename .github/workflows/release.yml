name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type. Auto reads commit messages (feat:=minor, fix:=patch, BREAKING CHANGE=major).'
        required: false
        type: choice
        default: auto
        options:
          - auto
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Determine version bump
        id: bump
        shell: bash
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          echo "current=$CURRENT" >> $GITHUB_OUTPUT

          # Find the last release tag
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            RANGE="HEAD"
          else
            RANGE="${LAST_TAG}..HEAD"
          fi
          echo "range=$RANGE" >> $GITHUB_OUTPUT
          echo "last_tag=$LAST_TAG" >> $GITHUB_OUTPUT

          BUMP="${{ github.event.inputs.bump }}"
          if [ "$BUMP" = "auto" ] || [ -z "$BUMP" ]; then
            # Read commits since last tag to determine bump type
            COMMITS=$(git log $RANGE --pretty=format:"%s" 2>/dev/null || git log --pretty=format:"%s")

            if echo "$COMMITS" | grep -qiE "^.*BREAKING CHANGE|^.*!:"; then
              BUMP="major"
            elif echo "$COMMITS" | grep -qiE "^feat"; then
              BUMP="minor"
            else
              BUMP="patch"
            fi
          fi
          echo "type=$BUMP" >> $GITHUB_OUTPUT

          # Calculate new version
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "$BUMP" in
            major) NEW="$((MAJOR+1)).0.0" ;;
            minor) NEW="${MAJOR}.$((MINOR+1)).0" ;;
            patch) NEW="${MAJOR}.${MINOR}.$((PATCH+1))" ;;
          esac
          echo "new=$NEW" >> $GITHUB_OUTPUT
          echo "Bump: $BUMP | $CURRENT -> $NEW"

      - name: Generate release notes
        id: notes
        shell: bash
        run: |
          RANGE="${{ steps.bump.outputs.range }}"
          LAST_TAG="${{ steps.bump.outputs.last_tag }}"
          NEW="${{ steps.bump.outputs.new }}"

          {
            echo "body<<RELEASE_EOF"
            echo "## What's Changed"
            echo ""

            # Features
            FEATS=$(git log $RANGE --pretty=format:"- %s" --grep="^feat" -i 2>/dev/null || true)
            if [ -n "$FEATS" ]; then
              echo "### New Features"
              echo "$FEATS" | sed 's/^- feat[:(]/- /' | sed 's/^- /- /'
              echo ""
            fi

            # Fixes
            FIXES=$(git log $RANGE --pretty=format:"- %s" --grep="^fix" -i 2>/dev/null || true)
            if [ -n "$FIXES" ]; then
              echo "### Bug Fixes"
              echo "$FIXES" | sed 's/^- fix[:(]/- /' | sed 's/^- /- /'
              echo ""
            fi

            # CI/Chore/Other
            OTHERS=$(git log $RANGE --pretty=format:"- %s" 2>/dev/null | grep -viE "^- (feat|fix)" || true)
            if [ -n "$OTHERS" ]; then
              echo "### Other Changes"
              echo "$OTHERS"
              echo ""
            fi

            if [ -n "$LAST_TAG" ]; then
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${LAST_TAG}...v${NEW}"
            fi
            echo "RELEASE_EOF"
          } >> $GITHUB_OUTPUT

      - name: Bump version in package.json
        shell: bash
        run: |
          NEW="${{ steps.bump.outputs.new }}"
          node -e "
            const pkg = require('./package.json');
            pkg.version = '$NEW';
            require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build

      - name: Embed Discord Client Secret
        run: npm run generate:secrets
        env:
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}

      - name: Build Electron (Windows)
        run: npx electron-builder --win --config .electron-builder.config.js --publish never

      - name: Commit version bump
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: bump version to ${{ steps.bump.outputs.new }}"
          git push

      # Local git tag in THIS (soundpad-pro) repo — separate from the deck-*
      # GitHub Release tag below, which lives in prelive-releases and is never
      # fetched into this checkout. Without this, "Determine version bump"'s
      # `git describe --tags --abbrev=0` would stop finding new tags after this
      # story ships, and every future changelog range would grow unbounded from
      # v2.32.0 instead of the previous release.
      - name: Tag version bump
        shell: bash
        run: |
          NEW="${{ steps.bump.outputs.new }}"
          git tag "v$NEW"
          git push origin "v$NEW"

      # Releases are published cross-repo to shaktech786/prelive-releases, which
      # is SHARED with the sibling "obs-setup" product. secrets.GITHUB_TOKEN only
      # grants write access to this (soundpad-pro) repo, so publishing there
      # requires a PAT with `contents: write` on prelive-releases, stored as the
      # RELEASES_REPO_TOKEN repo secret (must be created manually — see PR body).
      - name: Create GitHub Release (versioned)
        uses: softprops/action-gh-release@v2
        with:
          repository: shaktech786/prelive-releases
          token: ${{ secrets.RELEASES_REPO_TOKEN }}
          tag_name: deck-${{ steps.bump.outputs.new }}
          name: Prelive Deck v${{ steps.bump.outputs.new }}
          body: ${{ steps.notes.outputs.body }}
          draft: false
          # Never contend with obs-setup's releases for the repo-wide "latest"
          # slot — our auto-update feed is pinned to the deck-latest release
          # below, not GitHub's ambiguous /releases/latest endpoint.
          make_latest: false
          files: |
            dist/Prelive-Deck-Setup.exe
            dist/Prelive-Deck-Setup.exe.blockmap
            dist/latest.yml

      # TRANSITIONAL — also publish to THIS repo's releases.
      #
      # Every already-installed client has an app-update.yml baked in at build
      # time that points at shaktech786/soundpad-pro. They poll *this* repo, not
      # prelive-releases. If the feed-migration build were published only to
      # prelive-releases, those clients would never see it, would never receive
      # the build whose app-update.yml points at the new feed, and would be
      # stranded on a dead channel permanently — the exact outcome this story
      # exists to prevent.
      #
      # So the migration build must land where the old clients are already
      # looking. Keep this step until telemetry (or simply enough elapsed time)
      # says the old-feed population has drained, then delete it; new installs
      # never read this repo's releases.
      - name: Create GitHub Release on the legacy feed (migration bridge)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump.outputs.new }}
          # Named for what the build now is. Old clients find this release by
          # polling /releases/latest on this repo, not by matching its title.
          name: Prelive Deck v${{ steps.bump.outputs.new }} (formerly SoundPad Pro)
          body: ${{ steps.notes.outputs.body }}
          draft: false
          make_latest: true
          # Must track the renamed artifact — after this story the installer is
          # Prelive-Deck-Setup.exe, and latest.yml references it by that name.
          # Leaving the old filename here would fail the step and break the very
          # migration path this bridge exists to provide.
          files: |
            dist/Prelive-Deck-Setup.exe
            dist/Prelive-Deck-Setup.exe.blockmap
            dist/latest.yml

      # Rolling pointer release: same assets, fixed tag. This is the URL
      # .electron-builder.config.js's `publish.url` points at, so electron-updater
      # always resolves the newest build deterministically regardless of what
      # obs-setup publishes in between. Not for manual download — see the
      # versioned release above for changelog + installer.
      - name: Update deck-latest pointer release (auto-update feed target)
        uses: softprops/action-gh-release@v2
        with:
          repository: shaktech786/prelive-releases
          token: ${{ secrets.RELEASES_REPO_TOKEN }}
          tag_name: deck-latest
          name: "Prelive Deck — latest (auto-update feed)"
          body: |
            Rolling pointer consumed by the in-app auto-updater. Not for manual
            download — see the `deck-${{ steps.bump.outputs.new }}` release for
            release notes and the installer.
          draft: false
          make_latest: false
          files: |
            dist/Prelive-Deck-Setup.exe
            dist/Prelive-Deck-Setup.exe.blockmap
            dist/latest.yml
