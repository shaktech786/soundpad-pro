name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    # Pinned for the same reason as release.yml: windows-latest moved to an
    # image whose Visual Studio install node-gyp can't find, so rebuilding the
    # native deps (active-win, audify, node-hid) fails with "Could not find any
    # Visual Studio installation to use".
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build Next.js
        run: npm run build

      - name: Build Electron (Windows)
        run: npx electron-builder --win --config .electron-builder.config.js --publish never

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Prelive-Deck-Setup
          path: dist/Prelive-Deck-Setup.exe
          retention-days: 3
